<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <style>
    .shell { fill: #c9ccd5; } .edge { fill: #5b606d; } .screen { fill: #3a2ec4; } .glare { fill: #a29bff; } .btn { fill: #5b606d; }
    @media (prefers-color-scheme: dark) { .shell { fill: #2b2d34; } .edge { fill: #0b0c0e; } .screen { fill: #a29bff; } .glare { fill: #e4e1ff; } .btn { fill: #8b91a0; } }
  </style>
  <!-- top half (screen) -->
  <rect class="edge" x="2" y="0" width="12" height="8"/>
  <rect class="shell" x="3" y="1" width="10" height="6"/>
  <rect class="screen" x="4" y="2" width="8" height="4"/>
  <rect class="glare" x="5" y="3" width="2" height="1"/>
  <!-- hinge -->
  <rect class="edge" x="1" y="8" width="14" height="1"/>
  <!-- bottom half (controls) -->
  <rect class="edge" x="1" y="9" width="14" height="7"/>
  <rect class="shell" x="2" y="9" width="12" height="6"/>
  <rect class="btn" x="4" y="10" width="1" height="3"/>
  <rect class="btn" x="3" y="11" width="3" height="1"/>
  <rect class="btn" x="10" y="12" width="1" height="1"/>
  <rect class="btn" x="12" y="11" width="1" height="1"/>
</svg>
